<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiral Clock</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #ccc;
      font-family: system-ui, sans-serif;
    }

    #plot {
      position: absolute;
      inset: 0;
    }

    #time-marker-labels {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .time-marker-label {
      position: absolute;
      padding: 2px 4px;
      border: 1px solid rgba(143, 197, 255, 0.35);
      border-radius: 3px;
      background: rgba(17, 17, 17, 0.8);
      color: #d7eaff;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      transform: translate(-50%, -130%);
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 16px;
      z-index: 2;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    #hud div:first-child {
      font-size: 28px;
      color: #fff;
    }

    #time {
      color: #91cbff;
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.12em;
    }

    #views {
      position: absolute;
      top: 12px;
      right: 16px;
      z-index: 4;
      display: flex;
      gap: 6px;
    }

    #views button {
      background: #222;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    #views button:hover {
      background: #333;
      border-color: #4aa8ff;
    }

    #settings-button .gear-icon {
      display: inline-block;
      transform: scale(1.5);
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.45);
    }

    .settings-overlay[hidden] {
      display: none;
    }

    #settings-panel {
      width: min(360px, calc(100vw - 32px));
      padding: 20px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #181818;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      color: #ddd;
    }

    #settings-title {
      margin: 0 0 12px;
      color: #fff;
      font-size: 20px;
      font-weight: 500;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 1px solid #333;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-switch {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      flex: 0 0 auto;
      width: 42px;
      height: 24px;
      margin: 0;
      border: 1px solid #555;
      border-radius: 999px;
      background: #333;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .setting-switch::before {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ccc;
      content: "";
      transition: transform 150ms ease, background 150ms ease;
    }

    .setting-switch:checked {
      border-color: #4aa8ff;
      background: #245c91;
    }

    .setting-switch:checked::before {
      transform: translateX(18px);
      background: #fff;
    }

    .setting-switch:focus-visible {
      outline: 2px solid #8fc5ff;
      outline-offset: 2px;
    }

    #line-color {
      width: 48px;
      height: 32px;
      padding: 2px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #222;
      cursor: pointer;
    }

    #gesture-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.35);
      opacity: 1;
      transition: opacity 600ms ease, visibility 0s linear;
    }

    #gesture-overlay.is-hidden {
      visibility: hidden;
      opacity: 0;
      transition: opacity 600ms ease, visibility 0s linear 600ms;
    }

    #gesture-hint {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      border: 1px solid #444;
      border-radius: 8px;
      background: rgba(24, 24, 24, 0.96);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      color: #ddd;
      font-size: 14px;
      white-space: nowrap;
    }

    .gesture-hint-title {
      margin: 0;
      color: #fff;
      font-size: 20px;
      font-weight: 500;
      text-align: center;
    }

    .gesture-hint-subtitle {
      margin: 4px 0 0;
      color: #aaa;
      font-size: 13px;
      text-align: center;
    }

    .gesture-hint-controls {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    #gesture-overlay.timer-dismissed .gesture-hint-timer {
      display: none;
    }

    .gesture-hint-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gesture-hint-item svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #8fc5ff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .gesture-hint-timer {
      position: absolute;
      right: 1px;
      bottom: 1px;
      left: 1px;
      height: 2px;
      overflow: hidden;
      border-radius: 0 0 7px 7px;
      background: #333;
    }

    .gesture-hint-timer span {
      position: absolute;
      inset: 0;
      transform: scaleX(1);
      transform-origin: left;
      background: #4aa8ff;
      animation: gesture-hint-countdown 3s linear forwards;
    }

    @keyframes gesture-hint-countdown {
      to {
        transform: scaleX(0);
      }
    }

    @media (max-width: 420px) {
      #gesture-hint {
        gap: 12px;
        padding: 14px 16px;
        font-size: 12px;
      }

      .gesture-hint-controls {
        gap: 14px;
      }

      .gesture-hint-item {
        gap: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #gesture-overlay {
        transition-duration: 0s;
      }

      #time-markers-toggle,
      #time-format-toggle,
      .setting-switch::before {
        transition-duration: 0s;
      }

      .gesture-hint-timer span {
        animation: none;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-Ba9tR-7j.js"></script>
</head>

<body>
  <div id="hud">
    <div id="time"></div>
    <div id="span"></div>
  </div>
  <div id="views">
    <button data-view="xy">xy</button>
    <button data-view="xz">xz</button>
    <button data-view="yz">yz</button>
    <button id="gesture-help" type="button" aria-label="Show gesture controls" aria-controls="gesture-overlay" aria-expanded="false">?</button>
    <button id="settings-button" type="button" aria-label="Settings" aria-controls="settings-overlay" aria-expanded="false"><span class="gear-icon" aria-hidden="true">⚙</span></button>
  </div>
  <div id="gesture-overlay" role="dialog" aria-modal="true" aria-labelledby="gesture-hint-title">
    <aside id="gesture-hint" aria-label="Gesture controls">
      <div>
        <h1 id="gesture-hint-title" class="gesture-hint-title">Spiral Clock</h1>
        <p class="gesture-hint-subtitle">A 3D visualization of time</p>
      </div>
      <div class="gesture-hint-controls">
        <div class="gesture-hint-item">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 5v22M5 16h22M16 5l-3 3m3-3 3 3m-3 19-3-3m3 3 3-3M5 16l3-3m-3 3 3 3m19-3-3-3m3 3-3 3" />
          </svg>
          <span>Drag to orbit</span>
        </div>
        <div class="gesture-hint-item">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="9" y="3" width="14" height="26" rx="7" />
            <path d="M16 8v6m0 0-3-3m3 3 3-3M16 24v-6m0 0-3 3m3-3 3 3" />
          </svg>
          <span>Scroll to zoom</span>
        </div>
      </div>
      <div class="gesture-hint-timer" aria-hidden="true"><span></span></div>
    </aside>
  </div>
  <div id="settings-overlay" class="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <section id="settings-panel">
      <h2 id="settings-title">Settings</h2>
      <label class="setting-row" for="time-markers-toggle">
        <span>Time markers</span>
        <input id="time-markers-toggle" class="setting-switch" type="checkbox" checked>
      </label>
      <label class="setting-row" for="time-format-toggle">
        <span>24-hour time</span>
        <input id="time-format-toggle" class="setting-switch" type="checkbox">
      </label>
      <label class="setting-row" for="line-color">
        <span>Line color</span>
        <input id="line-color" type="color" value="#2f8cff">
      </label>
    </section>
  </div>
  <div id="plot"></div>
  <div id="time-marker-labels" aria-hidden="true"></div>
</body>

</html>
