<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spiral Clock</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #ccc;
      font-family: system-ui, sans-serif;
    }

    #plot {
      position: absolute;
      inset: 0;
    }

    #time-marker-labels {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .time-marker-label {
      position: absolute;
      padding: 2px 4px;
      border: 1px solid rgba(143, 197, 255, 0.35);
      border-radius: 3px;
      background: rgba(17, 17, 17, 0.8);
      color: #d7eaff;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      transform: translate(-50%, -130%);
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 16px;
      z-index: 2;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    #hud div:first-child {
      font-size: 28px;
      color: #fff;
    }

    #time {
      color: #91cbff;
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.12em;
    }

    #views {
      position: absolute;
      top: 12px;
      right: 16px;
      z-index: 4;
      display: flex;
    }

    #controls-list {
      display: flex;
      gap: 6px;
    }

    #controls-menu-toggle {
      display: none;
    }

    #controls-menu-toggle svg {
      display: block;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    #views button {
      background: #222;
      color: #ddd;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    #views button:hover {
      background: #333;
      border-color: #4aa8ff;
    }

    #settings-button .gear-icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      transform: scale(1.5);
    }

    #settings-button {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #center-button svg {
      display: block;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #center-button {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #center-button[hidden] {
      display: none;
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: 16px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.45);
    }

    .settings-overlay[hidden] {
      display: none;
    }

    #settings-panel {
      width: min(360px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      border: 1px solid #444;
      border-radius: 8px;
      background: #181818;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      color: #ddd;
    }

    #settings-title {
      margin: 0 0 12px;
      color: #fff;
      font-size: 20px;
      font-weight: 500;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 1px solid #333;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-switch {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      flex: 0 0 auto;
      width: 42px;
      height: 24px;
      margin: 0;
      border: 1px solid #555;
      border-radius: 999px;
      background: #333;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .setting-switch::before {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ccc;
      content: "";
      transition: transform 150ms ease, background 150ms ease;
    }

    .setting-switch:checked {
      border-color: #4aa8ff;
      background: #245c91;
    }

    .setting-switch:checked::before {
      transform: translateX(18px);
      background: #fff;
    }

    .setting-switch:focus-visible {
      outline: 2px solid #8fc5ff;
      outline-offset: 2px;
    }

    #line-color {
      width: 48px;
      height: 32px;
      padding: 2px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #222;
      cursor: pointer;
    }

    #gesture-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.35);
      opacity: 1;
      transition: opacity 600ms ease, visibility 0s linear;
    }

    #gesture-overlay.is-hidden {
      visibility: hidden;
      opacity: 0;
      transition: opacity 600ms ease, visibility 0s linear 600ms;
    }

    #gesture-hint {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      border: 1px solid #444;
      border-radius: 8px;
      background: rgba(24, 24, 24, 0.96);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      color: #ddd;
      font-size: 14px;
      white-space: nowrap;
    }

    .gesture-hint-title {
      margin: 0;
      color: #fff;
      font-size: 20px;
      font-weight: 500;
      text-align: center;
    }

    .gesture-hint-subtitle {
      margin: 4px 0 0;
      color: #aaa;
      font-size: 13px;
      text-align: center;
    }

    .gesture-hint-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    #gesture-overlay.timer-dismissed .gesture-hint-timer {
      display: none;
    }

    .gesture-hint-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gesture-hint-item svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #8fc5ff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .gesture-hint-timer {
      position: absolute;
      right: 1px;
      bottom: 1px;
      left: 1px;
      height: 2px;
      overflow: hidden;
      border-radius: 0 0 7px 7px;
      background: #333;
    }

    .gesture-hint-timer span {
      position: absolute;
      inset: 0;
      transform: scaleX(1);
      transform-origin: left;
      background: #4aa8ff;
      animation: gesture-hint-countdown 3s linear forwards;
    }

    @keyframes gesture-hint-countdown {
      to {
        transform: scaleX(0);
      }
    }

    @media (max-width: 420px) {
      #gesture-hint {
        gap: 12px;
        padding: 14px 16px;
        font-size: 12px;
      }

      .gesture-hint-controls {
        gap: 10px;
      }

      .gesture-hint-item {
        gap: 5px;
      }
    }

    @media (max-width: 640px) {
      #views {
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }

      #controls-menu-toggle {
        order: 0;
      }

      #center-button:not([hidden]) {
        position: absolute;
        top: 0;
        right: 54px;
      }

      #controls-menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #controls-list {
        order: 1;
        display: none;
        flex-direction: column;
        align-items: stretch;
        min-width: 56px;
        gap: 6px;
        padding: 6px;
        border: 1px solid #444;
        border-radius: 6px;
        background: rgba(17, 17, 17, 0.96);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }

      #views.is-open #controls-list {
        display: flex;
      }

      #controls-list button {
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #gesture-overlay {
        transition-duration: 0s;
      }

      #time-markers-toggle,
      #time-format-toggle,
      .setting-switch::before {
        transition-duration: 0s;
      }

      .gesture-hint-timer span {
        animation: none;
      }
    }
  </style>

</head>

  </div>
  <div id="views">
    <button id="controls-menu-toggle" type="button" aria-label="Open controls menu" aria-controls="controls-list" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">

cy='12'%20r='3'%20/%3e%3c/svg%3e" alt="" aria-hidden="true"></button>
    </div>
    <button id="center-button" type="button" aria-label="Center on current time" title="Center on current time" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7" />
        <circle cx="12" cy="12" r="2" />
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
      </svg>
    </button>
  </div>
  <div id="gesture-overlay" role="dialog" aria-modal="true" aria-labelledby="gesture-hint-title">
    <aside id="gesture-hint" aria-label="Gesture controls">
      <div>
        <h1 id="gesture-hint-title" class="gesture-hint-title">Spiral Clock</h1>
        <p class="gesture-hint-subtitle">A 3D visualization of time</p>
      </div>
      <div class="gesture-hint-controls">
        <div class="gesture-hint-item">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 5v22M5 16h22M16 5l-3 3m3-3 3 3m-3 19-3-3m3 3 3-3M5 16l3-3m-3 3 3 3m19-3-3-3m3 3-3 3" />

  </div>
  <div id="settings-overlay" class="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <section id="settings-panel">
      <h2 id="settings-title">Settings</h2>
      <label class="setting-row" for="time-markers-toggle">
        <span>Time markers</span>
        <input id="time-markers-toggle" class="setting-switch" type="checkbox" checked>
      </label>
      <label class="setting-row" for="time-format-toggle">
        <span>24-hour time</span>
        <input id="time-format-toggle" class="setting-switch" type="checkbox">
      </label>
      <label class="setting-row" for="line-color">
        <span>Line color</span>
        <input id="line-color" type="color" value="#2f8cff">
      </label>
    </section>
  </div>
  <div id="plot"></div>
  <div id="time-marker-labels" aria-hidden="true"></div>

</html>
